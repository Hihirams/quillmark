<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quillmark{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Self-hosted AI text detector. {{ engine_count }} open detection engines run on this server; nothing is sent to third parties.{% endblock %}">
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171322" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex">
    <link rel="preload" href="/static/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/system.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/quillmark.css">
</head>
<body class="st-root">
    <a class="qm-skip" href="#main-content">Skip to content</a>
    <header class="st-header">
        <div class="st-header__inner">
            <a href="/" class="st-logo" aria-label="Quillmark home">
                <img src="/static/quillmark-margen.svg" alt="" width="40" height="40">
                <span class="st-logo__word">Quillmark</span>
            </a>
            <nav class="st-header__nav" aria-label="Main">
                <a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Detector</a>
                <a href="/coach"{% if request.url.path == "/coach" %} aria-current="page"{% endif %}>Style coach</a>
                <a href="/docs">API</a>
                <a href="https://github.com/Hihirams/quillmark" class="hide-sm">GitHub</a>
            </nav>
        </div>
    </header>
    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="st-footer">
        <div class="footer-line">
            <span><strong>Quillmark</strong> <span class="qm-edition">&middot; Hiram G. edition</span></span>
            <span>Self-hosted &middot; <a href="https://github.com/Hihirams/quillmark">Source</a> &middot; <a href="https://github.com/Hihirams/quillmark/blob/master/CREDITS.md">Open-source credits</a></span>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
